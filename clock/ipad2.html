<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- ホーム画面に追加した際にSafariの上部バーを消す設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>デジタル時計</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #00ffcc;
            overflow: hidden;
        }

        /* ==========================================
           1. 全体の位置・【時刻上部の隙間】の調整
           ========================================== */
        .clock-container {
            width: 100%;
            text-align: center;
            /* ★時刻上部の隙間：マイナス値を大きくすると上に詰まり、プラスにすると下に下がります */
            margin-top: -20px;
            padding-top: 0;
        }

        /* ==========================================
           2. 【時刻】のフォント・サイズ調整
           ========================================== */
        #time {
            /* ★時刻のフォント */
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            /* ★時刻のフォントサイズ */
            font-size: 350px;
            font-weight: bold;
            line-height: 0.88;
            letter-spacing: -5px;
            margin: 0;
            padding: 0;
        }

        /* ==========================================
           3. 【月日】のフォント・サイズ・【時刻との間隔】調整
           ========================================== */
        #date {
            /* ★月日のフォント */
            font-family: "Helvetica Neue", Helvetica, "Hiragino Kaku Gothic ProN", "Hiragino Sans", sans-serif;
            /* ★月日のフォントサイズ */
            font-size: 110pt;
            font-weight: bold;
            line-height: 1.1;
            letter-spacing: 0px;
            /* ★時刻と月日の間の間隔：数値を大きくすると間が広がります */
            margin-top: 20px;
            padding: 0;
            white-space: nowrap;
        }

        /* ==========================================
           4. 【区切り線（ボーダー）】の太さ・長さ・【上下の間隔】調整
           ========================================== */
        .divider {
            /* ★線の横幅 */
            width: 90%;
            /* ★線の太さ */
            height: 0px;
            /* ★線の色 */
            background-color: #00ffcc;
            border: none;
            /* ★ボーダー上下の間隔：[上(月日との間)] [右] [下(予定との間)] [左] */
            margin: 10px auto 20px auto;
        }

        /* ==========================================
           5. 【予定メッセージ（マーキー）】のフォント・サイズ・速度調整
           ========================================== */
        .marquee-wrapper {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
        }

        #schedule {
            display: inline-block;
            /* ★予定メッセージのフォント */
            font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Helvetica Neue", sans-serif;
            /* ★予定メッセージのフォントサイズ */
            font-size: 110pt;
            font-weight: bold;
            /* ★予定メッセージの文字色（オレンジ） */
            color: #ff9900;
            line-height: 1.15;
            padding-left: 100%;
            /* ★流れるスピード（12s = 12秒で1周。数字を小さくすると速く、大きくするとゆっくりになります） */
            -webkit-animation: marquee 12s linear infinite;
            animation: marquee 
 linear infinite;
        }

        /* 古いiPadのSafari用アニメーション定義 */
        @-webkit-keyframes marquee {
            0%   { -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); }
            100% { -webkit-transform: translate3d(-100%, 0, 0); transform: translate3d(-100%, 0, 0); }
        }
        @keyframes marquee {
            0%   { -webkit-transform: translate3d(0, 0, 0); transform: translate3d(0, 0, 0); }
            100% { -webkit-transform: translate3d(-100%, 0, 0); transform: translate3d(-100%, 0, 0); }
        }

        /* ==========================================
           （参考）iPadを縦置きにした時の自動縮小設定
           ========================================== */
        @media screen and (max-width: 800px) {
            .clock-container { margin-top: -10px; }
            #time { font-size: 210px; letter-spacing: -2px; }
            #date { font-size: 55pt; margin-top: 25px; }
            .divider { margin: 20px auto 15px auto; }
            #schedule { font-size: 55pt; }
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <div id="time">00:00</div>
        <div id="date">1/01 日曜日</div>
        <div class="divider"></div>
        <!-- マーキー表示エリア -->
        <div class="marquee-wrapper">
            <div id="schedule">予定を読み込み中...</div>
        </div>
    </div>

    <script>
        var lastMessage = '';

        function updateClock() {
            var now = new Date();

            // 1行目：時刻（時:分のみ）
            var hours = ('0' + now.getHours()).slice(-2);
            var minutes = ('0' + now.getMinutes()).slice(-2);
            document.getElementById('time').innerHTML = hours + ':' + minutes;

            // 2行目：m/dd ＊曜日 表記（括弧なし、例: 11/12 木曜日）
            var month = now.getMonth() + 1;
            var day = ('0' + now.getDate()).slice(-2);
            var daysOfWeek = ['日曜日', '月曜日', '火曜日', '水曜日', '木曜日', '金曜日', '土曜日'];
            var dayOfWeek = daysOfWeek[now.getDay()];
            document.getElementById('date').innerHTML = month + '/' + day + ' ' + dayOfWeek;

            // 3行目：曜日ごとの予定判定
            // 0:日, 1:月, 2:火, 3:水, 4:木, 5:金, 6:土
            var currentHour = now.getHours();
            var today = now.getDay();
            var targetDay = today;
            var prefix = '今日は';

            // ★切り替え時刻の判定（金曜日(5)は午後3時=15時、それ以外の曜日は11時）
            var switchHour = (today === 5) ? 15 : 11;

            if (currentHour >= switchHour) {
                targetDay = (today + 1) % 7;
                prefix = '明日は';
            }

            var message = '';
            if (targetDay === 0) {
                // 日曜日
                message = prefix + '予定なし';
            } else if (targetDay === 1 || targetDay === 3) {
                // 月・水曜
                message = prefix + 'リハビリ　8時45分';
            } else if (targetDay === 2 || targetDay === 4 || targetDay === 6) {
                // 火・木・土曜
                message = prefix + '透析　9時45分';
            } else if (targetDay === 5) {
                // 金曜日
                message = prefix + '訪問看護 13時30分';
            }

            // メッセージが切り替わった時だけHTMLを更新
            if (message !== lastMessage) {
                document.getElementById('schedule').innerHTML = message;
                lastMessage = message;
            }
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
