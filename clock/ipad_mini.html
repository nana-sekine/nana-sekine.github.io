<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<!-- ホーム画面に追加した際に全画面（アプリ風）で表示する設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>デジタル時計</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #000000; /* 背景色：黒 */
    color: #ffffff;            /* 文字色：白 */
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none; /* 文字の選択を無効化 */
  }
  .container {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-align-items: center;
    align-items: center;
    width: 100%;
    height: 100%;
    text-align: center;
  }
  #date {
    font-size: 6vw; /* 画面幅に応じたサイズ */
    color: #aaaaaa;
    margin-bottom: 2vh;
    letter-spacing: 0.05em;
  }
  #time {
    font-size: 20vw; /* 画面幅に応じた特大サイズ */
    font-weight: bold;
    line-height: 1.1;
    letter-spacing: 0.02em;
    /* 数字の幅を等幅にして秒が変わってもガタつかないようにする */
    font-variant-numeric: tabular-nums;
  }
  #seconds {
    font-size: 10vw;
    color: #cccccc;
    margin-left: 1vw;
  }
</style>
</head>
<body>

<div class="container">
  <div id="date">----/--/-- (-)</div>
  <div id="time">00:00<span id="seconds">00</span></div>
</div>

<script>
  function zeroPad(num) {
    return (num < 10 ? '0' : '') + num;
  }

  function updateClock() {
    var now = new Date();
    var year = now.getFullYear();
    var month = zeroPad(now.getMonth() + 1);
    var day = zeroPad(now.getDate());
    
    var weekDays = ['日', '月', '火', '水', '木', '金', '土'];
    var weekDay = weekDays[now.getDay()];

    var hours = zeroPad(now.getHours());
    var minutes = zeroPad(now.getMinutes());
    var seconds = zeroPad(now.getSeconds());

    document.getElementById('date').textContent = year + '年' + month + '月' + day + '日 (' + weekDay + ')';
    document.getElementById('time').innerHTML = hours + ':' + minutes + '<span id="seconds">' + seconds + '</span>';
  }

  // 初回実行と1秒ごとの更新
  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
