<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>デジタル時計（天気付き）</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #000000;
    color: #ffffff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
  }
  .container {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-align-items: center;
    align-items: center;
    width: 100%;
    height: 100%;
    text-align: center;
  }
  #time {
    font-size: 21vw;
    font-weight: bold;
    line-height: 1.05;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  #seconds {
    font-size: 9vw;
    color: #cccccc;
    margin-left: 1vw;
  }
  #date {
    font-size: 6.5vw;
    color: #aaaaaa;
    margin-top: 2vh;
    letter-spacing: 0.05em;
  }
  #weather {
    font-size: 4.5vw;
    color: #88ccff;
    margin-top: 2.5vh;
    letter-spacing: 0.03em;
    padding: 0 3vw;
  }
</style>
</head>
<body>

<div class="container">
  <div id="time">00:00<span id="seconds">00</span></div>
  <div id="date">--月--日 (-)</div>
  <div id="weather">天気を取得中 (1/2)...</div>
</div>

<script>
  function zeroPad(num) {
    return (num < 10 ? '0' : '') + num;
  }

  function updateClock() {
    var now = new Date();
    var month = zeroPad(now.getMonth() + 1);
    var day = zeroPad(now.getDate());
    var weekDays = ['日', '月', '火', '水', '木', '金', '土'];
    var weekDay = weekDays[now.getDay()];
    var hours = zeroPad(now.getHours());
    var minutes = zeroPad(now.getMinutes());
    var seconds = zeroPad(now.getSeconds());

    document.getElementById('time').innerHTML = hours + ':' + minutes + '<span id="seconds">' + seconds + '</span>';
    document.getElementById('date').textContent = month + '月' + day + '日 (' + weekDay + ')';
  }

  // ルート2：wttr.in（超軽量テキスト天気API）から取得
  function tryWttr() {
    document.getElementById('weather').textContent = '天気を取得中 (2/2)...';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'https://wttr.in', true);
    xhr.timeout = 6000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200 && xhr.responseText && xhr.responseText.trim().charAt(0) !== '<') {
          document.getElementById('weather').textContent = '須賀川 ' + xhr.responseText.trim();
        } else {
          document.getElementById('weather').textContent = 'iOS12証明書期限切れのため天気取得不可（詳細案内を参照）';
        }
      }
    };
    xhr.ontimeout = function() {
      document.getElementById('weather').textContent = '通信タイムアウト (2/2)';
    };
    xhr.onerror = function() {
      document.getElementById('weather').textContent = '通信ブロック (2/2) - iOS12証明書更新が必要です';
    };
    xhr.send();
  }

  // ルート1：Open-Meteoから取得（6秒でタイムアウト設定）
  function updateWeather() {
    document.getElementById('weather').textContent = '天気を取得中 (1/2)...';
    var url = 'https://open-meteo.com';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 6000;
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            var temp = Math.round(data.current_weather.temperature);
            var code = data.current_weather.weathercode;
            var icon = '🌤 晴れ';
            if (code === 0) icon = '☀️ 快晴';
            else if (code === 3) icon = '☁️ 曇り';
            else if (code >= 51 && code <= 67) icon = '🌧 雨';
            else if (code >= 71 && code <= 77) icon = '❄️ 雪';
            document.getElementById('weather').textContent = '須賀川 ' + icon + ' 現在 ' + temp + '℃';
          } catch (e) {
            tryWttr();
          }
        } else {
          tryWttr();
        }
      }
    };
    xhr.ontimeout = function() {
      tryWttr();
    };
    xhr.onerror = function() {
      tryWttr();
    };
    xhr.send();
  }

  updateClock();
  setInterval(updateClock, 1000);

  updateWeather();
  setInterval(updateWeather, 30 * 60 * 1000);
</script>

</body>
</html>
