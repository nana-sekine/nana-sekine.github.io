<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>デジタル時計（天気付き）</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 100%;
    height: 100%;
    background-color: #000000;
    color: #ffffff;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    overflow: hidden;
    -webkit-user-select: none;
  }
  .container {
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-justify-content: center;
    justify-content: center;
    -webkit-align-items: center;
    align-items: center;
    width: 100%;
    height: 100%;
    text-align: center;
  }
  /* 1行目：時分 */
  #time {
    font-size: 21vw;
    font-weight: bold;
    line-height: 1.05;
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  #seconds {
    font-size: 9vw;
    color: #cccccc;
    margin-left: 1vw;
  }
  /* 2行目：月日曜日 */
  #date {
    font-size: 6.5vw;
    color: #aaaaaa;
    margin-top: 2vh;
    letter-spacing: 0.05em;
  }
  /* 3行目：天気予報 */
  #weather {
    font-size: 4.5vw;
    color: #88ccff;
    margin-top: 2.5vh;
    letter-spacing: 0.03em;
    padding: 0 3vw;
  }
</style>
</head>
<body>

<div class="container">
  <div id="time">00:00<span id="seconds">00</span></div>
  <div id="date">--月--日 (-)</div>
  <div id="weather">天気を取得中...</div>
</div>

<script>
  function zeroPad(num) {
    return (num < 10 ? '0' : '') + num;
  }

  // 時計の更新（1秒ごと）
  function updateClock() {
    var now = new Date();
    var month = zeroPad(now.getMonth() + 1);
    var day = zeroPad(now.getDate());
    
    var weekDays = ['日', '月', '火', '水', '木', '金', '土'];
    var weekDay = weekDays[now.getDay()];

    var hours = zeroPad(now.getHours());
    var minutes = zeroPad(now.getMinutes());
    var seconds = zeroPad(now.getSeconds());

    document.getElementById('time').innerHTML = hours + ':' + minutes + '<span id="seconds">' + seconds + '</span>';
    document.getElementById('date').textContent = month + '月' + day + '日 (' + weekDay + ')';
  }

  // 天気文言に絵文字を付与
  function formatWeatherIcon(text) {
    if (text.indexOf('雪') !== -1) return '❄️ ' + text;
    if (text.indexOf('雨') !== -1) return '🌧 ' + text;
    if (text.indexOf('晴') !== -1 && text.indexOf('曇') !== -1) return '🌤 ' + text;
    if (text.indexOf('晴') !== -1) return '☀️ ' + text;
    if (text.indexOf('曇') !== -1) return '☁️ ' + text;
    return text;
  }

  // 気象庁の公式HTTPSデータから福島県（中通り＝須賀川市）の天気を取得
  function updateWeather() {
    var url = 'https://jma.go.jp';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        if (xhr.status === 200) {
          try {
            var data = JSON.parse(xhr.responseText);
            // 070000 = 福島県, areas = 中通り（須賀川市）
            var weatherText = data.timeSeries.areas.weathers;
            weatherText = weatherText.replace(/　/g, ' ');
            
            // 気温データの取得
            var temps = data.timeSeries.areas.temps;
            var tempStr = '';
            if (temps && temps.length >= 2 && temps !== temps) {
              tempStr = ' (' + temps + '℃/' + temps + '℃)';
            } else if (temps && temps.length >= 1) {
              tempStr = ' (' + temps + '℃)';
            }

            document.getElementById('weather').textContent = 
              '須賀川 ' + formatWeatherIcon(weatherText) + tempStr;
          } catch (e) {
            document.getElementById('weather').textContent = '解析エラー: ' + e.message;
          }
        } else {
          document.getElementById('weather').textContent = '取得エラー (HTTP ' + xhr.status + ')';
        }
      }
    };
    xhr.send();
  }

  updateClock();
  setInterval(updateClock, 1000);

  updateWeather();
  setInterval(updateWeather, 30 * 60 * 1000);
</script>

</body>
</html>
