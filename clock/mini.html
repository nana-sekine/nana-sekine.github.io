<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Tall Clock</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'HelveticaNeue-CondensedBold', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    #time {
      font-size: 26vw;
      line-height: 1;
      letter-spacing: 0.02em;
      font-variant-numeric: lining-nums tabular-nums;
      -webkit-font-feature-settings: "lnum" 1, "tnum" 1;
      font-feature-settings: "lnum" 1, "tnum" 1;
      -webkit-transform: scaleY(1.35);
      transform: scaleY(1.35);
      margin-bottom: 6vh;
    }
    #date {
      font-size: 6vw;
      color: #888;
      letter-spacing: 0.05em;
      -webkit-transform: scaleY(1.2);
      transform: scaleY(1.2);
    }
    #font-label {
      position: fixed;
      bottom: 20px;
      font-size: 15px;
      color: #666;
      font-family: -apple-system, sans-serif;
    }
    #tap-area {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
      touch-action: manipulation;
    }
  </style>
</head>
<body>
  <div id="time">00:00</div>
  <div id="date">11/21 (Sat)</div>
  <div id="font-label">Font: HelveticaNeue-CondensedBold (1/10)</div>
  <div id="tap-area"></div>

  <script>
    // iOS 12（iPad mini 2）に最初から内蔵されているフォント一覧
    var fonts = [
      'HelveticaNeue-CondensedBold',
      'HelveticaNeue-CondensedBlack',
      'Futura-CondensedExtraBold',
      'Futura-CondensedMedium',
      'AvenirNextCondensed-Bold',
      'AvenirNextCondensed-Heavy',
      'ArialRoundedMTBold',
      'Hiragino Maru Gothic ProN',
      'DINAlternate-Bold',
      'TrebuchetMS-Bold'
    ];
    var currentIndex = 0;

    function changeFont() {
      currentIndex = (currentIndex + 1) % fonts.length;
      var selectedFont = fonts[currentIndex];
      var timeEl = document.getElementById('time');
      var dateEl = document.getElementById('date');
      
      timeEl.style.fontFamily = "'" + selectedFont + "', sans-serif";
      dateEl.style.fontFamily = "'" + selectedFont + "', sans-serif";
      
      document.getElementById('font-label').textContent = 'Font: ' + selectedFont + ' (' + (currentIndex + 1) + '/' + fonts.length + ')';
    }

    document.getElementById('tap-area').addEventListener('click', changeFont);

    function updateClock() {
      var now = new Date();
      var hours = ('0' + now.getHours()).slice(-2);
      var minutes = ('0' + now.getMinutes()).slice(-2);
      
      var month = ('0' + (now.getMonth() + 1)).slice(-2);
      var day = ('0' + now.getDate()).slice(-2);
      var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var dayName = days[now.getDay()];

      document.getElementById('time').textContent = hours + ':' + minutes;
      document.getElementById('date').textContent = month + '/' + day + ' (' + dayName + ')';
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
