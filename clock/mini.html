<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Tall Clock</title>
  <!-- 縦長フォント（Oswald）をGoogle Fontsから読み込み -->
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #aaa;
      font-family: 'Varela Round', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #time {
      font-size: 35vw;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      
  /* 標準的な指定（iOS 12 Safari対応） */
  font-variant-numeric: lining-nums tabular-nums;
  
  /* 古いブラウザや一部のフォントで確実に効かせるための保険 */
  -webkit-font-feature-settings: "lnum" 1, "tnum" 1;
  font-feature-settings: "lnum" 1, "tnum" 1;riant-numeric: lining-nums tabular-nums;



      
      /* フォントをさらに縦長に強調する設定（iOS 12対応） */
      -webkit-transform: scaleY(1.5);
      transform: scaleY(1.5);
      margin-bottom: 5vh;
    }
    #date {
      font-size: 6vw;
      font-weight: 500;
      color: #888;
      letter-spacing: 0.05em;
      -webkit-transform: scaleY(1.2);
      transform: scaleY(1.2);
    }
  </style>
</head>
<body>
  <div id="time">00:00</div>
  <div id="date">11/21 (Sat)</div>

  <script>
    function updateClock() {
      var now = new Date();
      var hours = ('0' + now.getHours()).slice(-2);
      var minutes = ('0' + now.getMinutes()).slice(-2);
      
      var month = ('0' + (now.getMonth() + 1)).slice(-2);
      var day = ('0' + now.getDate()).slice(-2);
      var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var dayName = days[now.getDay()];

      document.getElementById('time').textContent = hours + ':' + minutes;
      document.getElementById('date').textContent = month + '/' + day + ' (' + dayName + ')';
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
