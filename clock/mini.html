<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Tall Clock</title>
  
  <!-- iOS 12 Safari互換の旧API形式（Ralewayを追加） -->
  <link href="https://googleapis.com|Bebas+Neue|Fjalla+One|Fredoka+One|Nunito:700|Oswald:700|Quicksand:700|Raleway:700|Teko:600|Varela+Round&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Oswald', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #time {
      font-size: 26vw;
      font-weight: 700;
      line-height: 1;
      letter-spacing: 0.02em;
      
      /* Lining Figures（高さ揃え）＋ Tabular Figures（等幅）の設定 */
      font-variant-numeric: lining-nums tabular-nums;
      -webkit-font-feature-settings: "lnum" 1, "tnum" 1;
      font-feature-settings: "lnum" 1, "tnum" 1;
      
      /* 縦長に引き伸ばす設定 */
      -webkit-transform: scaleY(1.35);
      transform: scaleY(1.35);
      margin-bottom: 6vh;
    }
    #date {
      font-size: 6vw;
      color: #888;
      letter-spacing: 0.05em;
      -webkit-transform: scaleY(1.2);
      transform: scaleY(1.2);
    }
    #font-label {
      position: fixed;
      bottom: 20px;
      font-size: 16px;
      color: #666;
      font-family: -apple-system, sans-serif;
    }
    /* iOS Safariで画面タップを確実に受け取るための透明レイヤー */
    #tap-area {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="time">00:00</div>
  <div id="date">11/21 (Sat)</div>
  <div id="font-label">Font: Oswald (1/10) | Lining: ON</div>
  <div id="tap-area"></div>

  <script>
    var fonts = [
      'Oswald',
      'Bebas Neue',
      'Anton',
      'Teko',
      'Fjalla One',
      'Fredoka One',
      'Nunito',
      'Quicksand',
      'Varela Round',
      'Raleway'
    ];
    var currentIndex = 0;

    function changeFont() {
      currentIndex = (currentIndex + 1) % fonts.length;
      var selectedFont = fonts[currentIndex];
      document.body.style.fontFamily = "'" + selectedFont + "', -apple-system, sans-serif";
      document.getElementById('font-label').textContent = 'Font: ' + selectedFont + ' (' + (currentIndex + 1) + '/' + fonts.length + ') | Lining: ON';
    }

    document.getElementById('tap-area').addEventListener('click', changeFont);

    function updateClock() {
      var now = new Date();
      var hours = ('0' + now.getHours()).slice(-2);
      var minutes = ('0' + now.getMinutes()).slice(-2);
      
      var month = ('0' + (now.getMonth() + 1)).slice(-2);
      var day = ('0' + now.getDate()).slice(-2);
      var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var dayName = days[now.getDay()];

      document.getElementById('time').textContent = hours + ':' + minutes;
      document.getElementById('date').textContent = month + '/' + day + ' (' + dayName + ')';
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
