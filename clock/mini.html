<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- ホーム画面追加時にアドレスバーを消す設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Varela Round Clock</title>
  <style>
    @font-face {
      font-family: 'VarelaRound';
      src: url('./VarelaRound-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'VarelaRound', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    #clock-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 1s ease;
    }

    #time {
      font-size: 33vw;
      line-height: 1;
      letter-spacing: 0.02em;
      /* 高さと横幅を揃える設定 */
      font-variant-numeric: lining-nums tabular-nums;
      -webkit-font-feature-settings: "lnum" 1, "tnum" 1;
      font-feature-settings: "lnum" 1, "tnum" 1;
      /* 縦長に引き伸ばす設定 */
      -webkit-transform: scaleY(1.4);
      transform: scaleY(1.4);
      margin-bottom: 6vh;
    }

    #date {
      font-size: 6vw;
      color: #888;
      letter-spacing: 0.05em;
      -webkit-transform: scaleY(1.2);
      transform: scaleY(1.2);
    }
  </style>
</head>
<body>
  <div id="clock-wrapper">
    <div id="time">00:00</div>
    <div id="date">11/23 (Mon)</div>
  </div>

  <script>
    var lastMinute = -1;

    function updateClock() {
      var now = new Date();
      var hours = ('0' + now.getHours()).slice(-2);
      var minutes = ('0' + now.getMinutes()).slice(-2);
      
      var month = ('0' + (now.getMonth() + 1)).slice(-2);
      var day = ('0' + now.getDate()).slice(-2);
      var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      var dayName = days[now.getDay()];

      document.getElementById('time').textContent = hours + ':' + minutes;
      document.getElementById('date').textContent = month + '/' + day + ' (' + dayName + ')';

      // 画面の焼き付き防止（1分ごとに位置を数ピクセルだけずらす）
      if (now.getMinutes() !== lastMinute) {
        lastMinute = now.getMinutes();
        var offsetX = Math.floor(Math.random() * 11) - 5; // -5px 〜 +5px
        var offsetY = Math.floor(Math.random() * 11) - 5; // -5px 〜 +5px
        var wrapper = document.getElementById('clock-wrapper');
        wrapper.style.webkitTransform = 'translate(' + offsetX + 'px, ' + offsetY + 'px)';
        wrapper.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px)';
      }
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
